services:
  app:
    build: .
    container_name: nssbackend
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/nssbackend
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - ADMIN_SEED_PASSWORD=${ADMIN_PASSWORD}
      - PORT=8081
      - REDIS_URL=${REDIS_URL}
      - NSS_MAIL=${NSS_MAIL}
      - BREVO_LOGIN=${BREVO_LOGIN}
      - BREVO_PASSWORD=${BREVO_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - db
    restart: unless-stopped  # Auto-restart on crashes
  
  db:
    image: postgres:13-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nssbackend
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: